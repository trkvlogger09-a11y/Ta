<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARUN ARMY - Premium Channel</title>
    <!-- Google Fonts for Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Full Screen Green Flash on Button Click */
        #green-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #10b981;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #green-flash.active {
            opacity: 1;
        }

        /* Top Bar Animation */
        .top-bar {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: 600;
            animation: fadeInDown 0.8s ease;
        }

        .top-bar span {
            color: #38bdf8;
            font-weight: 800;
        }

        .open-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            transition: 0.3s ease;
        }

        .open-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.8);
        }

        /* Main Card */
        .card {
            background: rgba(255, 255, 255, 0.98);
            width: 100%;
            max-width: 420px;
            padding: 40px 25px;
            border-radius: 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(56, 189, 248, 0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            animation: fadeInUp 0.8s ease;
        }

        /* Ultra Glowing Animation Container for Image */
        .img-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-container::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff007f, #7928ca, #0070f3, #38bdf8, #ff007f);
            animation: rotateGlow 3s linear infinite;
            filter: blur(8px);
            z-index: 1;
        }

        .img-container::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff007f, #7928ca, #0070f3, #38bdf8, #ff007f);
            animation: rotateGlow 3s linear infinite;
            z-index: 1;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .profile-img {
            position: relative;
            width: 142px;
            height: 142px;
            border-radius: 50%;
            object-fit: cover;
            background: #ffffff;
            z-index: 2;
            border: 4px solid #ffffff;
        }

        /* Premium Typography for Headline */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subscribers {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Features List */
        .features {
            text-align: left;
            width: 100%;
            padding: 0 10px;
            margin-bottom: 30px;
        }

        .features p {
            font-size: 14px;
            color: #334155;
            margin-bottom: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .features p span {
            font-weight: 800;
            color: #0f172a;
        }

        /* Button Wrapper for Lighting Animation */
        .btn-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn-wrapper::before {
            content: '';
            position: absolute;
            inset: -4px;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc, #38bdf8);
            background-size: 300% 300%;
            border-radius: 50px;
            animation: btnLighting 4s ease infinite;
            z-index: 1;
            filter: blur(6px);
            opacity: 0.8;
        }

        @keyframes btnLighting {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Join Button */
        .join-btn {
            position: relative;
            background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
            color: #ffffff;
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 2;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .join-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(14, 165, 233, 0.7);
        }

        .telegram-icon {
            font-size: 20px;
            animation: bounceIcon 1.5s ease infinite;
        }

        @keyframes bounceIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* Footer Instruction */
        .footer-text {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.4;
            max-width: 280px;
            font-weight: 500;
        }

        /* Keyframe Animations for Page Load */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Green Flash Screen Effect -->
    <div id="green-flash"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        Opening Telegram in <span id="countdown">3</span> s
        <a href="https://t.me/+S_-EP2gtaNsxOWY1" class="open-btn" onclick="triggerGreen(event)">Open now</a>
    </div>

    <!-- Main Card Box -->
    <div class="card">
        <!-- Animated Image Container -->
        <div class="img-container">
            <img src="https://d1yei2z3i6k35z.cloudfront.net/18503587/6abe6112074112.44554605_10076.png" alt="Tarun Army" class="profile-img">
        </div>

        <!-- Headline -->
        <h1>TARUN ARMY</h1>
        <div class="subscribers">30,830 subscribers</div>

        <!-- Features -->
        <div class="features">
            <p>1. <span>Learn</span> & <span>Explore Trading</span></p>
            <p>2. <span>Real</span>, <span>Trusted</span> & <span>Genuine Platform</span></p>
            <p>3. <span>Interactive</span> & <span>Learning Engagement</span></p>
        </div>

        <!-- Join Button with Lighting Animation -->
        <div class="btn-wrapper">
            <a href="https://t.me/+S_-EP2gtaNsxOWY1" class="join-btn" onclick="triggerGreen(event)">
                <span class="telegram-icon">✈️</span> FREE JOIN CHANNEL
            </a>
        </div>

        <!-- Bottom Instruction -->
        <div class="footer-text">
            Tap JOIN CHANNEL, then tap "Request to Join" in Telegram
        </div>
    </div>

    <script>
        // Countdown logic
        let timeLeft = 3;
        const countdownEl = document.getElementById('countdown');
        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                countdownEl.textContent = timeLeft;
            } else {
                clearInterval(timer);
            }
        }, 1000);

        // Green Screen Flash Effect on Button/Link Click
        function triggerGreen(event) {
            event.preventDefault(); // Thodi der ke liye default action rokein taaki animation dikhe
            const flash = document.getElementById('green-flash');
            const targetUrl = event.currentTarget.getAttribute('href');
            
            flash.classList.add('active'); // Screen green ho jayegi

            setTimeout(() => {
                window.location.href = targetUrl; // Telegram link par redirect ho jayega
            }, 400); // 0.4 seconds baad redirect
        }
    </script>

</body>
</html>
